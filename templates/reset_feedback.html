<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|default('Status') }} — {{ site_name|default('OgwenofayaVisuals') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .feedback-wrap {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.05);
    }
    .status-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
    }
    .status-icon.success {
      background: #ecfdf5;
      color: #10b981;
    }
    .status-icon.error {
      background: #fef2f2;
      color: #ef4444;
    }
    .feedback-text {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .login-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .login-link:hover {
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="feedback-wrap">
    {% set error_state = is_error|default(false) %}
    <div class="status-icon {{ 'error' if error_state else 'success' }}">
      <i class="fa-solid {{ 'fa-circle-xmark' if error_state else 'fa-circle-check' }}"></i>
    </div>
    <p class="feedback-text">
      {{ message|safe if message else ("Something went wrong. Please try again." if error_state else "Your request has been completed successfully.") }}
    </p>
    <a href="{{ action_url|default(url_for('login')) }}" class="login-link">
      {{ action_text|default("Sign In") }} <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
</body>
</html>
