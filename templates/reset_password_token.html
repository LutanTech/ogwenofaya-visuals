<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060913">
  <title>Set New Password — {{ site_name|default('OgwenofayaVisuals') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script>
    (function() {
      const saved = localStorage.getItem('studio_admin_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg-base: #060913;
      --bg-grid: rgba(255, 255, 255, 0.025);
      --bg-surface: #0b1120;
      --bg-surface-hover: #131c33;
      --border-subtle: #1e293b;
      --border-active: #334155;
      --accent: #22d3ee;
      --accent-contrast: #060913;
      --accent-glow: rgba(34, 211, 238, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #fb7185;
      --danger-bg: rgba(251, 113, 133, 0.12);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg-base: #f1f5f9;
      --bg-grid: rgba(15, 23, 42, 0.035);
      --bg-surface: #ffffff;
      --bg-surface-hover: #f8fafc;
      --border-subtle: #cbd5e1;
      --border-active: #94a3b8;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --accent-glow: rgba(37, 99, 235, 0.1);
      --text-main: #0f172a;
      --text-muted: #475569;
      --danger: #e11d48;
      --danger-bg: #fff1f2;
      --shadow-card: 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-base);
      background-image: linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
                        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .auth-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
    }
    .studio-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .studio-brand img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-active);
    }
    .studio-brand span { color: var(--accent); }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover {
      border-color: var(--border-active);
      background: var(--bg-surface-hover);
      color: var(--accent);
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-top: 2px solid var(--accent);
      border-radius: 10px;
      padding: 32px;
      box-shadow: var(--shadow-card);
    }
    .auth-card h1 {
      font: 800 1.35rem 'Plus Jakarta Sans', sans-serif;
      margin: 0 0 6px;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    .auth-card p {
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background: var(--bg-base);
      color: var(--text-main);
      font-size: 0.85rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .auth-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      margin-top: 6px;
    }
    .auth-btn:hover {
      opacity: 0.9;
    }
    .auth-btn:active {
      transform: scale(0.98);
    }
    .password-error {
      color: var(--danger);
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 6px;
      display: none;
    }
    .auth-footer {
      text-align: center;
      padding: 20px 32px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>
  <header class="auth-topbar">
    <a href="{{ url_for('index') }}" class="studio-brand">
      <img src="{{ url_for('static', filename='logos/logo.png') }}" alt="">
      <span>{{ site_name|default('OgwenofayaVisuals') }}</span>
    </a>
    <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Light/Dark Mode" title="Toggle Theme">
      <i class="fa-solid fa-sun" id="theme-icon"></i>
    </button>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Create new password</h1>
      <p>Please enter and confirm your secure new password (minimum 8 characters).</p>
      
      <form method="post" id="resetForm">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" required minlength="8" autocomplete="new-password">
          <span class="password-error" id="passwordError">Passwords do not match.</span>
        </div>

        <button type="submit" class="auth-btn"><i class="fa-solid fa-lock"></i> Update Password</button>
      </form>
    </div>
  </main>

  <footer class="auth-footer">
    &copy; {{ year|default(2026) }} {{ site_name|default('OgwenofayaVisuals') }} &bull; Secured Portal
  </footer>

  <script>
    (function(){
      const toggleBtn = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      const root = document.documentElement;

      function updateIcon(theme) {
        if (theme === 'light') {
          icon.className = 'fa-solid fa-moon';
        } else {
          icon.className = 'fa-solid fa-sun';
        }
      }

      updateIcon(root.getAttribute('data-theme') || 'dark');

      toggleBtn.addEventListener('click', function() {
        const current = root.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('studio_admin_theme', next);
        updateIcon(next);
      });

      const form = document.getElementById('resetForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirm_password');
      const errorMsg = document.getElementById('passwordError');
      if(!form) return;
      
      form.addEventListener('submit', function(e){
        if(password.value !== confirmPassword.value){
          e.preventDefault();
          errorMsg.style.display = 'block';
          confirmPassword.style.borderColor = 'var(--danger)';
          confirmPassword.focus();
        } else {
          errorMsg.style.display = 'none';
          confirmPassword.style.borderColor = '';
        }
      });
      confirmPassword.addEventListener('input', function(){
        if(password.value === confirmPassword.value){
          errorMsg.style.display = 'none';
          confirmPassword.style.borderColor = '';
        }
      });
    })();
  </script>
</body>
</html>
